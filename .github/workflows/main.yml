name: Backend CI/CD Release

on:
  push:
    branches:
      - '**' # Triggers on a commit to any branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend 

    steps:
      # Step 1: Check out your code repository
      - name: Check out Repository
        uses: actions/checkout@v4

      # Step 2: Initialize Node.js environment
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # FIX: If your project is a monorepo and the backend is inside a folder named "backend",
          # this path is correct. If your standalone repository ONLY contains the backend 
          # at the absolute root, change this line to: cache-dependency-path: 'package-lock.json'
          cache-dependency-path: './backend/package-lock.json'

      # Step 3: Install pristine dependencies from your lockfile
      - name: Install Dependencies
        run: npm ci

      # Step 4: Generate Prisma Client artifacts and Engines
      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate --schema=prisma/schema.prisma

      # Step 5: Safely push structural schema migrations up to your Supabase instance
      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      # Step 6: Compile NestJS TypeScript source down to production distribution files
      - name: Build NestJS Application
        run: npm run build

      # Step 7: Bundle and archive output distribution code into a downloadable artifact
      - name: Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-backend-release
          # FIX: Because this action evaluates paths from the absolute root, 
          # ensure these match your actual folder structure.
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma
